<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Control room</title>
<style>
  :root { --bg:#0f0e0d; --fg:#f5f4f2; --mut:#a8a29e; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font:14px system-ui, "Segoe UI", "DejaVu Sans", sans-serif; }
  body { display:grid; grid-template-rows:auto 1fr; }
  h1 { margin:0; padding:10px 18px; font-size:16px; letter-spacing:.02em; display:flex; gap:12px; align-items:baseline; }
  h1 small { color:var(--mut); font-weight:400; }
  .panes { display:grid; grid-template-columns:1.25fr 1fr 1fr; gap:8px; padding:0 8px 70px; min-height:0; }
  .pane { display:grid; grid-template-rows:auto 1fr; min-height:0; border-radius:10px; overflow:hidden; background:#1a1816; }
  .pane b { padding:6px 12px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); }
  #cap { position:fixed; left:0; right:0; bottom:0; padding:16px 28px; background:#ea2328; color:#fff; font-size:24px; font-weight:600; text-align:center; transform:translateY(110%); transition:transform .4s; z-index:9; }
  #cap.on { transform:none; }
  body { cursor:none; }
  iframe { border:0; width:100%; height:100%; background:#f6f5f3; }
</style>
</head>
<body>
<h1>Control room <small>three devices, no cloud: each pane is a separate Couchbase Lite database, joined by peer-to-peer replication</small></h1>
<div class="panes" id="p"></div>
<div id="cap"></div>
<script>
// ?ports=18801,18802,18803 and ?autoplay=1; the panes are the tablet, the branch office and head office.
const Q = new URLSearchParams(location.search), capEl = document.getElementById("cap");
const ports = (Q.get("ports") || "18801,18802,18803").split(",");
const names = ["Field tablet", "Branch office", "Head office"];
addEventListener("message", (e) => {
  if (e.data === "autoplay-done") { document.title = "autoplay-done"; capEl.classList.remove("on"); }
  else if (e.data && e.data.cap) { capEl.textContent = e.data.cap; capEl.classList.add("on"); }
});
ports.forEach((p, i) => {
  const d = document.createElement("div"); d.className = "pane";
  const b = document.createElement("b"); b.textContent = names[i] || "Node " + (i + 1);
  const f = document.createElement("iframe");
  f.src = location.protocol + "//" + location.hostname + ":" + p + "/demo?embed=1" + (i === 0 && Q.get("autoplay") ? "&autoplay=1" : "");
  d.append(b, f); document.getElementById("p").append(d);
});
</script>
</body>
</html>
