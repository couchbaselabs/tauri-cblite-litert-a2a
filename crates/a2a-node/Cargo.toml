[package]
name = "a2a-node"
version = "0.1.0"
edition = "2021"

[features]
default = ["enterprise"]
enterprise = ["couchbase_lite/enterprise", "a2a-cblite/enterprise"]
# Real agent: on-device LLM (LiteRT-LM). Linux/macOS only - Google ships no Windows runtime.
litert = ["a2a-cblite/litert"]

[dependencies]
a2a-cblite = { path = "../a2a-cblite", default-features = false }
couchbase_lite.workspace = true
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"
serde_json = "1"
